name: Browser scrape (daily)

on:
  schedule:
    - cron: "10 14 * * *"
  workflow_dispatch:
    inputs:
      city:
        description: "City to scrape"
        required: false
        default: "vancouver"
      send_email:
        description: "Send digest email"
        required: false
        default: "true"
      sources:
        description: "Optional single source (livrent | rentals-ca | padmapper | hotpads | apartments-com)"
        required: false
        default: ""
      max_price:
        description: "Override max price"
        required: false
        default: "4000"
      bedrooms:
        description: "Override bedrooms; blank means city default"
        required: false
        default: ""

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        city: [vancouver]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run browser scrape
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SEARCH_CITY: ${{ github.event.inputs.city || matrix.city }}
          SEARCH_BEDROOMS: ${{ github.event.inputs.bedrooms || '' }}
          SEARCH_MAX_PRICE: ${{ github.event.inputs.max_price || '4000' }}
          SOURCE_ARG: ${{ github.event.inputs.sources || '' }}
          SEND_EMAIL: ${{ github.event.inputs.send_email || 'true' }}
        run: |
          ARGS=""
          if [ -n "$SOURCE_ARG" ]; then ARGS="$SOURCE_ARG"; fi
          if [ "$SEND_EMAIL" != "false" ]; then ARGS="$ARGS --email"; fi
          npx tsx scripts/scrape-browser.ts $ARGS
